name: rove
title: Rove
base: core24
version: '4.1.1'
license: 'AGPL-3.0-or-later'
website: 'https://thiagomof.github.io/rove'
issues: 'https://github.com/thiagomof/rove/issues'
source-code: 'https://github.com/thiagomof/rove'
contact: 'contato@blueenergia.com'
summary: A fast, modern video & audio downloader for YouTube and more
description: |
  Rove is a cross-platform, open-source app that makes it easy to download videos, audio, subtitles, and metadata from YouTube and hundreds of other supported websites. It provides a clean desktop interface on top of the powerful yt-dlp engine, so you get advanced download features without needing the command line.

  You can choose the quality and format, download individual items or entire playlists, and manage downloads with pause and resume support. Rove is free, privacy-friendly, and fully open source, with no ads, no tracking, and no unnecessary complexity.

grade: stable
confinement: strict

icon: src-tauri/icons/icon.png

platforms:
  amd64:
    build-on: amd64
    build-for: amd64
  arm64:
    build-on: arm64
    build-for: arm64

layout:
  /usr/lib/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/webkit2gtk-4.1

apps:
  rove:
    command: usr/bin/rove
    desktop: usr/share/applications/Rove.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-status
      - home
      - unity7
      - single-instance-plug
    slots:
      - single-instance

slots:
  single-instance:
    interface: dbus
    bus: session
    name: com-thiagomof-rove.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: com-thiagomof-rove.SingleInstance

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/24/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libssl-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu

      npm ci
      
      rustup toolchain install stable
      rustup default stable
      cargo install --locked cargo-about

      npm run tauri build -- --bundles deb --no-sign -c '{"plugins":{"updater":{"active":false}}}'
      dpkg -x src-tauri/target/release/bundle/deb/*.deb "$SNAPCRAFT_PART_INSTALL/"
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/webkit2gtk-4.1"

      for TRIPLET in x86_64-linux-gnu aarch64-linux-gnu; do
        SRC="$CRAFT_PART_INSTALL/usr/lib/$TRIPLET/webkit2gtk-4.1"
        if [ -d "$SRC" ]; then
          cp -a "$SRC/." "$CRAFT_PART_INSTALL/usr/lib/webkit2gtk-4.1/"
          break
        fi
      done

      DESKTOP_FILE="$SNAPCRAFT_PART_INSTALL/usr/share/applications/Rove.desktop"
      if [ -f "$DESKTOP_FILE" ]; then
        sed -i -E 's/^Categories=.*/Categories=Network;AudioVideo;Utility;/' "$DESKTOP_FILE"
      fi
